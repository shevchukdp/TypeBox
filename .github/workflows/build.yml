name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION file
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "VERSION file: $v"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $ver = "${{ steps.ver.outputs.value }}"
          if ($tag -ne $ver) {
            Write-Error "Tag '$tag' does not match VERSION file '$ver'. Bump VERSION before tagging."
            exit 1
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Smoke test (exe starts, correct version)
        shell: pwsh
        run: |
          if (-not (Test-Path build/TypeBox.exe)) { Write-Error "no exe"; exit 1 }
          $ver = "${{ steps.ver.outputs.value }}"
          & cmd /c "build\TypeBox.exe --version >nul 2>&1"
          if ($LASTEXITCODE -ne 0) { Write-Error "exe --version exited $LASTEXITCODE"; exit 1 }
          # GUI must stay alive (missing-DLL builds die immediately with 0xC0000135)
          New-Item -ItemType Directory -Path build/Plugins -Force | Out-Null
          if (Test-Path build/calc.dll) { Copy-Item build/calc.dll build/Plugins/ -Force }
          $p = Start-Process build/TypeBox.exe -PassThru
          Start-Sleep -Seconds 3
          if ($null -eq (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) {
            Write-Error "GUI process died immediately (missing runtime DLL?)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          # the portable log must show the correct version (proves real startup)
          $log = Get-Content build/TypeBox.log -Raw -ErrorAction SilentlyContinue
          if (-not $log -or $log -notmatch [regex]::Escape("TypeBox $ver started")) {
            Write-Error "startup log missing/does not report version $ver"
            exit 1
          }
          # the example plugin must load through the TypeAndRun ABI (catches MSVC export issues)
          if ($log -match "ignored non-plugin|plugin load failed") {
            Write-Error "example plugin calc.dll failed to load`n$log"
            exit 1
          }
          if ($log -notmatch "started; \d+ aliases, [1-9]\d* plugins") {
            Write-Error "example plugin not discovered by host`n$log"
            exit 1
          }
          # settings dialog must build, pump messages and close cleanly
          Remove-Item build/TypeBox.log -ErrorAction SilentlyContinue
          & cmd /c "build\TypeBox.exe --test-settings >nul 2>&1"
          if ($LASTEXITCODE -ne 0) { Write-Error "settings dialog self-test exited $LASTEXITCODE"; exit 1 }
          $log2 = Get-Content build/TypeBox.log -Raw -ErrorAction SilentlyContinue
          if (-not $log2 -or $log2 -notmatch "settings self-test OK") {
            Write-Error "settings self-test line missing from log`n$log2"
            exit 1
          }
          Write-Host "Smoke OK: TypeBox $ver + calc plugin + settings dialog verified"

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.value }}"
          $zip = "TypeBox-$ver-windows-x64.zip"
          $stage = "stage"
          New-Item -ItemType Directory -Path "$stage/TypeBox/docs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stage/TypeBox/Plugins" -Force | Out-Null
          Copy-Item build/TypeBox.exe "$stage/TypeBox/"
          if (Test-Path build/calc.dll) { Copy-Item build/calc.dll "$stage/TypeBox/Plugins/" }
          Copy-Item TypeBox.ini      "$stage/TypeBox/"
          Copy-Item README.md        "$stage/TypeBox/"
          Copy-Item LICENSE          "$stage/TypeBox/"
          Copy-Item CHANGELOG.md     "$stage/TypeBox/"
          Copy-Item docs/*.md        "$stage/TypeBox/docs/"
          Compress-Archive -Path "$stage/TypeBox" -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_OUTPUT
        id: pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeBox-windows-x64
          path: ${{ steps.pack.outputs.ZIP }}

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.ZIP }}
          prerelease: true
          generate_release_notes: false
          body: |
            **TypeBox v${{ steps.ver.outputs.value }}** — universal hotkey console + bash + launcher for Windows.

            ### Roots & inspiration
            - **Root ancestor:** [TypeAndRun](https://github.com/galancev/typeandrun) by Evgeniy Galantsev (2001–2004, GPL-3.0) — TypeBox continues its idea, command/alias engine, INI config schema and plugin ABI.
            - **Inspired by:** [Microsoft PowerToys Run](https://learn.microsoft.com/windows/powertoys/run), [Flow Launcher](https://www.flowlauncher.com/), [Wox](https://github.com/Wox-launcher/Wox), [Raycast](https://www.raycast.com/), [Alfred](https://www.alfredapp.com/), [ConEmu](https://conemu.github.io/) (portable INI), [Guake](https://github.com/Guake/guake)/[Yakuake](https://kde.org/applications/utilities/org.kde.yakuake)/[Drop](https://github.com/marcinwicherek/drop) (console/bash mode).

            See [CHANGELOG.md](https://github.com/shevchukdp/TypeBox/blob/main/CHANGELOG.md) for what's new in this version.
