; TypeBox — portable configuration. Keep this file next to TypeBox.exe.
; Nothing is stored in the registry or %APPDATA%: copy the folder → setup moves.
; Legacy TypeAndRun.ini migration: see docs/CONFIG.md

[HotKey]
Key=113
AltKey=0
CtrlKey=1
ShiftKey=1
WinKey=0

[Show]
Width=720
CenterScreenY=1
HideOnDeactivate=1

[Exec]
Internal=1
Aliases=1
WWW=1
EMail=1
Files=1
Shell=1

[Shell]
Command=cmd.exe
Args=/c

[History]
Max=200

[Aliases]
notepad = notepad.exe %s
calc    = calc.exe
gh      = https://github.com/search?q=%s
cmd     = cmd.exe /k %s
typebox = %TYPEBOXDIR%
