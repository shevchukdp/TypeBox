; TypeBox — portable configuration. Keep this file next to TypeBox.exe.
; Nothing is stored in the registry or %APPDATA%: copy the folder → setup moves.
; Legacy TypeAndRun.ini migration: see docs/CONFIG.md

[HotKey]
Key=113
AltKey=0
CtrlKey=1
ShiftKey=1
WinKey=0

[Show]
Width=720
Height=40
CenterScreenX=1
CenterScreenY=1
HideOnDeactivate=1
ShowConsoleOnStart=1
TrayIcon=1
BalloonTips=1
Transparent=255
; AutoHide=1 hides the console after AutoHideValue seconds of idleness
AutoHide=0
AutoHideValue=30

[Exec]
Internal=1
Aliases=1
WWW=1
EMail=1
Files=1
Shell=1

[Shell]
Command=cmd.exe
Args=/c

[Undo]
UseUndo=1

[Font]
Name=Courier New
Size=18
Bold=1

[Type]
; EasyType completion: 0=off, 1=easy, 2=linux-style (Tab completes, repeat Tab cycles)
EasyType=2
UseInternalET=1
UseAliasET=1
UseHistoryET=1

[Color]
; COLORREF integers (0x00BBGGRR as decimal); -1 = system default
;ConsoleBG=3355443
;ConsoleFG=16777215

[History]
Max=200
Internal=1
Alias=1
WWW=1
EMail=1
Path=1
Plugins=1
Unknown=1

[Sounds]
EnableSounds=1
; per-execution-type sounds, paths relative to the portable Sounds\ folder; "none" disables
;ExecuteAliasSound=Sounds\alias.wav

[Aliases]
notepad = notepad.exe %s
calc    = calc.exe
gh      = https://github.com/search?q=%s
cmd     = cmd.exe /k %s
typebox = %TYPEBOXDIR%
; legacy pipe form: action|param|dir|state|priori|comment
;myide  = "C:\tools\ide.exe"|"%1"|C:\tools|3||my IDE
