; TypeBox — portable configuration. Keep this file next to TypeBox.exe.
; Nothing is stored in the registry or %APPDATA%: copy the folder → setup moves.
; Legacy TypeAndRun.ini migration: see docs/CONFIG.md

[HotKey]
Key=113
AltKey=0
CtrlKey=1
ShiftKey=1
WinKey=0

[Show]
Width=720
Height=56
CenterScreenX=1
CenterScreenY=1
HideOnDeactivate=1
ShowConsoleOnStart=1
TrayIcon=1
BalloonTips=1
Transparent=255
; AutoHide=1 hides the console after AutoHideValue seconds of idleness
AutoHide=0
AutoHideValue=30
; process class of TypeBox itself: idle | normal | high | realtime
Priority=normal

[Exec]
Internal=1
Aliases=1
WWW=1
EMail=1
Files=1
Shell=1

[Shell]
Command=cmd.exe
Args=/c

[Undo]
UseUndo=1

[Font]
Name=Courier New
Size=18
Bold=1
; ApplyEnglish=1 switches the keyboard layout to EN while typing commands (TypeAndRun)
ApplyEnglish=0

[Type]
; EasyType completion: 0=off, 1=easy, 2=linux-style (Tab completes, repeat Tab cycles)
EasyType=2
UseInternalET=1
UseAliasET=1
UseHistoryET=1
UseSysAliasET=1
; Fuzzy=1: subsequence matching ("cl" finds calc / calibrate); 0 = TypeAndRun prefix mode
Fuzzy=1

[Color]
; COLORREF integers (0x00BBGGRR as decimal); -1 = system default
;ConsoleBG=3355443
;ConsoleFG=16777215

[History]
Max=200
Internal=1
Alias=1
WWW=1
EMail=1
Path=1
Plugins=1
Unknown=1

[Sounds]
EnableSounds=1
; per-execution-type sounds, paths relative to the portable Sounds\ folder; "none" disables
;ExecuteInternalSound=Sounds\internal.wav
;ExecuteAliasSound=Sounds\alias.wav
;ExecuteSysAliasSound=Sounds\sysalias.wav
;ExecuteURLSound=Sounds\url.wav
;ExecuteEmailSound=Sounds\email.wav
;ExecuteFileSound=Sounds\file.wav
;ExecuteFolderSound=Sounds\folder.wav
;ExecutePluginSound=Sounds\plugin.wav
;ExecuteShellSound=Sounds\shell.wav

[PluginState]
; per-plugin flags written by Settings -> Plugins (dll name without extension):
; <name>_Load=1|0          call Load() at start and route commands to it
; <name>_SaveHistory=1|0   remember its commands in the history
;calc_Load=1
;calc_SaveHistory=1

[Path]
; your own PATH folders (like the Windows Environment Variables dialog):
; programs there are launched by name and added to PATH for every child process.
; one folder per key, or semicolons in "Extra=.."; %VAR% and %TYPEBOXDIR% allowed
;Dir1 = C:\tools
;Dir2 = %TYPEBOXDIR%\bin

[Variables]
; your own variables: typed text and alias actions expand %NAME% like env vars
;MYDOCS = %USERPROFILE%\Documents

[Log]
; portable error log next to the exe; open it with the /log command
Enabled=1
File=TypeBox.log
MaxSizeKB=512
; what to do when the size cap is hit: rotate | truncate | timestamp | keep
Rewrite=rotate
; number of rotated copies (TypeBox.log.1 ... .N)
Keep=3

[Aliases]
notepad = notepad.exe %s
calc    = calc.exe
gh      = https://github.com/search?q=%s
cmd     = cmd.exe /k %s
typebox = %TYPEBOXDIR%
; legacy pipe form: action|param|dir|state|priori|comment
;myide  = "C:\tools\ide.exe"|"%1"|C:\tools|3||my IDE

[SysAliases]
; TypeAndRun-style system commands (~name=action). Comment everything out to get
; the built-in defaults: ~lock ~logoff ~sleep ~screensave ~reboot
; ~lock       = rundll32.exe user32.dll,LockWorkStation
; ~reboot     = shutdown.exe /r /t 5
; Define your own:
; ~notes      = notepad.exe

; Ignores.ini (separate portable file, one pattern per line) keeps the console
; hidden over the listed applications — process file name or window class,
; wildcards * and ? are allowed, ';' starts a comment. Example lines:
;   Code.exe
;   VMUIFrame

[UI]
; auto | en ru uk de fr es pt it zh ja ko ar tr pl vi hi id sw af am
Language = auto


[DropDown]
; suggestion list under the console (TypeAndRun parity)
Enable=1
Lines=8
ShowHistoryOnEmpty=1

[WebSearch]
; quicklinks: "g my query" opens the default browser (TypeBox 0.12.0)
; built-ins g/yt/gh ship in the exe; rows here override or add keywords
Enable=1
;gh=https://github.com/search?q=%s
;so=https://stackoverflow.com/search?q=%s

